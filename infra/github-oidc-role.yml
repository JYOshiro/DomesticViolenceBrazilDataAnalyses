AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC deployment role for the dashboard repository.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: ARN for the existing token.actions.githubusercontent.com IAM OIDC provider.
  GitHubRepository:
    Type: String
    Default: JYOshiro/DomesticViolenceBrazilDataAnalyses
    Description: GitHub owner/repository allowed to use this deployment role.

Resources:
  GitHubDashboardDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DomesticViolenceDashboardGitHubDeploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  # GitHub Actions jobs use the production environment in deploy-aws.yml.
                  # The second pattern supports GitHub's immutable owner/repository ID claims.
                  - !Sub 'repo:${GitHubRepository}:environment:production'
                  - 'repo:JYOshiro@*/DomesticViolenceBrazilDataAnalyses@*:environment:production'
      Policies:
        - PolicyName: DeployDashboardStaticSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageDashboardStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:UpdateStack
                Resource: '*'
              - Sid: ManageDashboardContent
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource: '*'
              - Sid: ProvisionDashboardInfrastructure
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketEncryption
                  - s3:GetBucketOwnershipControls
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:PutBucketEncryption
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateOriginAccessControl
                Resource: '*'
              - Sid: InvalidateDashboardDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Store this value in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDashboardDeployRole.Arn
